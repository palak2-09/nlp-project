services:
  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-replace-this-local-password}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-replace-this-local-password}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 512m
    volumes:
      - neo4j_data:/data
    ports:
      - "7474:7474"
      - "7687:7687"
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_PASSWORD:-replace-this-local-password}\" 'RETURN 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./backend
      args:
        INSTALL_ML_EXTRAS: ${PAPERGRAPH_ENABLE_EMBEDDINGS:-false}
    environment:
      PAPERGRAPH_DATA_DIR: /app/data
      PAPERGRAPH_GRAPH_BACKEND: neo4j
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-replace-this-local-password}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      PAPERGRAPH_SCHEMA_PATH: ${PAPERGRAPH_SCHEMA_PATH:-/app/app/nlp/schema.json}
      PAPERGRAPH_MAX_UPLOAD_BYTES: ${PAPERGRAPH_MAX_UPLOAD_BYTES:-26214400}
      PAPERGRAPH_CHUNK_SIZE_CHARS: ${PAPERGRAPH_CHUNK_SIZE_CHARS:-1200}
      PAPERGRAPH_CHUNK_OVERLAP_CHARS: ${PAPERGRAPH_CHUNK_OVERLAP_CHARS:-120}
      PAPERGRAPH_MIN_EXTRACTION_CONFIDENCE: ${PAPERGRAPH_MIN_EXTRACTION_CONFIDENCE:-0.0}
      PAPERGRAPH_GRAPH_MAX_NODES: ${PAPERGRAPH_GRAPH_MAX_NODES:-250}
      PAPERGRAPH_ANNOTATIONS_PATH: ${PAPERGRAPH_ANNOTATIONS_PATH:-/app/data/annotations/gold.jsonl}
      PAPERGRAPH_ENABLE_EMBEDDINGS: ${PAPERGRAPH_ENABLE_EMBEDDINGS:-false}
      PAPERGRAPH_EMBEDDING_MODEL: ${PAPERGRAPH_EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      PAPERGRAPH_ENTITY_MATCH_THRESHOLD: ${PAPERGRAPH_ENTITY_MATCH_THRESHOLD:-0.93}
      PAPERGRAPH_ENTITY_REVIEW_THRESHOLD: ${PAPERGRAPH_ENTITY_REVIEW_THRESHOLD:-0.78}
      PAPERGRAPH_LLM_PROVIDER: ${PAPERGRAPH_LLM_PROVIDER:-none}
      PAPERGRAPH_LLM_BASE_URL: ${PAPERGRAPH_LLM_BASE_URL:-https://api.openai.com/v1}
      PAPERGRAPH_LLM_API_KEY: ${PAPERGRAPH_LLM_API_KEY:-}
      PAPERGRAPH_LLM_MODEL: ${PAPERGRAPH_LLM_MODEL:-gpt-4.1-mini}
      PAPERGRAPH_LLM_TIMEOUT_SECONDS: ${PAPERGRAPH_LLM_TIMEOUT_SECONDS:-45}
      PAPERGRAPH_LLM_MAX_CHUNKS_PER_DOCUMENT: ${PAPERGRAPH_LLM_MAX_CHUNKS_PER_DOCUMENT:-20}
      PAPERGRAPH_LLM_MAX_INPUT_CHARS: ${PAPERGRAPH_LLM_MAX_INPUT_CHARS:-12000}
      PAPERGRAPH_LLM_MAX_OUTPUT_TOKENS: ${PAPERGRAPH_LLM_MAX_OUTPUT_TOKENS:-1200}
      PAPERGRAPH_CORS_ORIGINS: ${PAPERGRAPH_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080}
    volumes:
      - ./data:/app/data
    ports:
      - "8000:8000"
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 15s
      timeout: 3s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000/api
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  neo4j_data:
